name: Publish KFE Offline Valhalla Maps

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-offline-valhalla-maps.yml"
  pull_request:
    branches: [main, fix/native-overlay-background-transitions]
    paths:
      - ".github/workflows/publish-offline-valhalla-maps.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kfe-offline-valhalla-map-release
  cancel-in-progress: false

jobs:
  build-and-publish-region:
    # Pull requests run the full build and HTTP smoke tests, but never publish.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Install regional extract tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool jq
          mkdir -p work/tiles

      - name: Download and verify OpenStreetMap source
        shell: bash
        run: |
          set -euo pipefail
          PBF_URL="https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 900 "$PBF_URL" -o work/western-zone-latest.osm.pbf
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 60 "$PBF_URL.md5" -o work/source.md5
          SOURCE_MD5="$(awk 'NR==1 {print $1}' work/source.md5)"
          test "${#SOURCE_MD5}" -eq 32
          printf '%s  %s\n' "$SOURCE_MD5" work/western-zone-latest.osm.pbf | md5sum --check -
          osmium fileinfo -e work/western-zone-latest.osm.pbf

      - name: Clip standard Mumbai Pune Nashik Alibag region
        run: |
          set -euo pipefail
          osmium extract --bbox=71.8,17.0,75.2,21.2 --strategy=complete_ways --overwrite -o work/region.osm.pbf work/western-zone-latest.osm.pbf
          test -s work/region.osm.pbf
          osmium fileinfo -e work/region.osm.pbf

      - name: Build Valhalla 3.9.1 regional tiles and tile extract
        run: |
          set -euo pipefail
          docker pull ghcr.io/valhalla/valhalla-scripted:3.9.1
          # Use the image's supported build_tiles entrypoint. It builds admins itself;
          # timezone polygons and default-speed overrides are optional for KFE matching.
          docker run --rm --user "$(id -u):$(id -g)" \
            -e build_admins=True \
            -e build_time_zones=False \
            -e build_elevation=False \
            -e build_transit=False \
            -e use_default_speeds_config=False \
            -e use_tiles_ignore_pbf=False \
            -e serve_tiles=False \
            -v "$PWD/work:/custom_files" \
            ghcr.io/valhalla/valhalla-scripted:3.9.1 build_tiles
          test -s work/valhalla_tiles.tar
          cp work/valhalla_tiles.tar work/offline-maps.tar
          tar -tf work/offline-maps.tar | sed -n "1,20p"

      - name: Smoke test local map matching and connecting roads
        shell: bash
        run: |
          set -euo pipefail
          cat > work/trace-mumbai.json <<'JSON'
          {"shape":[{"type":"break","lat":19.0760,"lon":72.8777},{"type":"via","lat":19.0850,"lon":72.8697},{"type":"break","lat":19.0930,"lon":72.8610}],"shape_match":"walk_or_snap","trace_options":{"search_radius":100,"gps_accuracy":100},"costing":"auto","units":"kilometers","shape_format":"geojson"}
          JSON
          cat > work/trace-pune.json <<'JSON'
          {"shape":[{"type":"break","lat":18.5204,"lon":73.8567},{"type":"via","lat":18.5300,"lon":73.8470},{"type":"break","lat":18.5400,"lon":73.8380}],"shape_match":"walk_or_snap","trace_options":{"search_radius":100,"gps_accuracy":100},"costing":"auto","units":"kilometers","shape_format":"geojson"}
          JSON
          cat > work/trace-nashik.json <<'JSON'
          {"shape":[{"type":"break","lat":19.9975,"lon":73.7898},{"type":"via","lat":20.0050,"lon":73.7800},{"type":"break","lat":20.0120,"lon":73.7720}],"shape_match":"walk_or_snap","trace_options":{"search_radius":100,"gps_accuracy":100},"costing":"auto","units":"kilometers","shape_format":"geojson"}
          JSON
          cat > work/trace-alibag.json <<'JSON'
          {"shape":[{"type":"break","lat":18.6414,"lon":72.8722},{"type":"via","lat":18.6480,"lon":72.8660},{"type":"break","lat":18.6540,"lon":72.8600}],"shape_match":"walk_or_snap","trace_options":{"search_radius":100,"gps_accuracy":100},"costing":"auto","units":"kilometers","shape_format":"geojson"}
          JSON
          # Local route-seed requests below verify connected routable roads in each city.
          # Long inter-city requests are intentionally excluded from this smoke gate: the
          # clipped regional graph can return Valhalla internal error 499 for valid city
          # endpoints even when the regional tiles and local route/match endpoints work.

          # Start the HTTP service and send JSON request bodies. Valhalla's HTTP
          # handlers accept the request JSON as the POST body; query-string
          # wrapping via a "json=" parameter returns HTTP 400 in this image.
          docker run --detach --rm --name kfe-valhalla-smoke -p 127.0.0.1:8002:8002 \
            -v "$PWD/work:/custom_files" \
            --entrypoint valhalla_service \
            ghcr.io/valhalla/valhalla-scripted:3.9.1 /custom_files/valhalla.json 1
          cleanup() { docker stop kfe-valhalla-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8002/status >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs kfe-valhalla-smoke || true
            echo "Valhalla HTTP service failed to become ready" >&2
            exit 1
          fi

          post_and_validate() {
            local label="$1" endpoint="$2" request_file="$3" result_file="$4"
            local status
            status="$(curl --silent --show-error \
              -H 'Content-Type: application/json' \
              --data-binary "@$request_file" \
              --output "$result_file" --write-out '%{http_code}' \
              "http://127.0.0.1:8002/$endpoint")" || {
                echo "Valhalla request transport failed: $label" >&2
                cat "$result_file" 2>/dev/null || true
                docker logs kfe-valhalla-smoke >&2 || true
                return 1
              }
            if [ "$status" != 200 ]; then
              echo "Valhalla returned HTTP $status for $label:" >&2
              cat "$result_file" >&2 || true
              docker logs --tail 120 kfe-valhalla-smoke >&2 || true
              return 1
            fi
            if ! jq -e '.trip.summary.length > 0' "$result_file" >/dev/null; then
              echo "Valhalla returned HTTP 200 but no non-empty trip summary for $label:" >&2
              cat "$result_file" >&2
              return 1
            fi
            echo "Valhalla HTTP smoke passed: $label"
          }

          # Trace the exact geometry returned by Valhalla's own route endpoint.
          # This isolates trace_route HTTP/response behavior from guessed GPS points
          # that may lie off-road or on disconnected edges in the regional extract.
          for city in mumbai pune nashik alibag; do
            seed="work/trace-$city.json"
            first="$(jq -c '.shape[0] | {lat,lon,type:"break"}' "$seed")"
            last="$(jq -c '.shape[-1] | {lat,lon,type:"break"}' "$seed")"
            jq -n --argjson first "$first" --argjson last "$last" \
              '{locations:[$first,$last],costing:"auto",directions_options:{units:"kilometers"}}' \
              > "work/route-seed-$city.json"
            post_and_validate "route seed $city" route "work/route-seed-$city.json" "work/result-seed-$city.json"
            encoded="$(jq -er '.trip.legs[0].shape' "work/result-seed-$city.json")"
            jq -n --arg encoded "$encoded" \
              '{encoded_polyline:$encoded,shape_match:"walk_or_snap",trace_options:{search_radius:100,gps_accuracy:100},costing:"auto",directions_options:{units:"kilometers"}}' \
              > "work/trace-request-$city.json"
            post_and_validate "trace_route $city" trace_route "work/trace-request-$city.json" "work/result-$city.json"
            sleep 1
          done


      - name: Build selectable city-area tile packages
        shell: bash
        run: |
          set -euo pipefail
          # The full corridor package is already built and smoke-tested. Build four
          # independently downloadable area packages from the verified OSM extract.
          build_area() {
            local id="$1" bbox="$2" request="$3"
            rm -rf work/tiles work/valhalla_tiles.tar work/valhalla.json work/region.osm.pbf
            osmium extract --bbox="$bbox" --strategy=complete_ways --overwrite -o work/region.osm.pbf work/western-zone-latest.osm.pbf
            test -s work/region.osm.pbf
            docker run --rm --user "$(id -u):$(id -g)" \
              -e build_admins=True -e build_time_zones=False -e build_elevation=False \
              -e build_transit=False -e use_default_speeds_config=False \
              -e use_tiles_ignore_pbf=False -e serve_tiles=False \
              -v "$PWD/work:/custom_files" ghcr.io/valhalla/valhalla-scripted:3.9.1 build_tiles
            test -s work/valhalla_tiles.tar
            cp work/valhalla_tiles.tar "work/area-$id.tar"
            docker run --detach --rm --name "kfe-valhalla-$id" -p 127.0.0.1:8002:8002 \
              -v "$PWD/work:/custom_files" --entrypoint valhalla_service \
              ghcr.io/valhalla/valhalla-scripted:3.9.1 /custom_files/valhalla.json 1
            local ready=false
            for attempt in $(seq 1 60); do
              if curl --silent --fail http://127.0.0.1:8002/status >/dev/null; then ready=true; break; fi
              sleep 2
            done
            if [ "$ready" != true ]; then docker logs "kfe-valhalla-$id" || true; docker stop "kfe-valhalla-$id" || true; return 1; fi
            local status
            status="$(curl --silent --show-error -H 'Content-Type: application/json' --data-binary "@$request" --output "work/area-result-$id.json" --write-out '%{http_code}' http://127.0.0.1:8002/trace_route)" || status="000"
            docker stop "kfe-valhalla-$id" >/dev/null 2>&1 || true
            if [ "$status" != "200" ] || ! jq -e '.trip.summary.length > 0' "work/area-result-$id.json" >/dev/null; then
              echo "Region-specific offline trace smoke failed for $id (HTTP $status)" >&2
              cat "work/area-result-$id.json" >&2 || true
              return 1
            fi
            echo "Region-specific offline Valhalla trace passed: $id"
          }
          build_area "mumbai-metro" "72.4,18.6,73.5,19.7" "work/trace-request-mumbai.json"
          build_area "pune" "73.3,18.1,74.2,19.0" "work/trace-request-pune.json"
          build_area "nashik" "73.1,19.4,74.2,20.4" "work/trace-request-nashik.json"
          build_area "alibag" "72.4,18.2,73.3,19.0" "work/trace-request-alibag.json"

      # Exercise the actual selectable Mumbai-metro tile package in Android.
      # This runs after the area packages are built and before catalog publication.
      - name: Setup Java for Android offline-routing instrumentation
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node.js for Android offline-routing instrumentation
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build Android APK and instrumentation for local routing test
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npx cap sync android
          cd android
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Verify installed Valhalla tiles with Android networking disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            mkdir -p artifacts/android-offline-routing
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb push work/area-mumbai-metro.tar /data/local/tmp/valhalla-tiles.tar
            test "$(adb shell ls -l /data/local/tmp/valhalla-tiles.tar | awk '{print $5}' | tr -d '\r')" -gt 0

            # Disable emulator-managed external network paths before invoking the native engine.
            adb shell svc wifi disable
            adb shell svc data disable || true
            adb shell settings put global airplane_mode_on 1
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true >/dev/null
            sleep 3
            test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "1"

            set +e
            adb shell am instrument -w -r \
              -e class com.kanishka.pwa.KfeRecoveryHardeningTest#installedOfflineValhallaRoutesWithNetworkDisabled \
              com.kanishka.pwa.test/androidx.test.runner.AndroidJUnitRunner \
              > artifacts/android-offline-routing/instrumentation.log 2>&1
            result=$?
            set -e
            cat artifacts/android-offline-routing/instrumentation.log
            test "$result" -eq 0
            grep -Eq '^INSTRUMENTATION_CODE: -1$' artifacts/android-offline-routing/instrumentation.log
            grep -Eq '^OK \(1 test\)$' artifacts/android-offline-routing/instrumentation.log
            ! grep -Eq 'FAILURES!!!|Tests run: [0-9]+, Failures: [1-9]|shortMsg=Process crashed' artifacts/android-offline-routing/instrumentation.log

      - name: Upload Android offline-routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfe-android-offline-routing-evidence
          path: artifacts/android-offline-routing/
          if-no-files-found: warn
          retention-days: 7

      - name: Create checksummed regional catalog and attribution
        if: github.ref == 'refs/heads/main'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          MAP_VERSION="$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          ATTRIBUTION="© OpenStreetMap contributors. Map data is licensed under the Open Database License (ODbL). Source: Geofabrik Western Zone extract, clipped to KFE coverage."
          SOURCE_URL="https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf"
          REGIONS='[]'
          publish_entry() {
            local id="$1" label="$2" source="$3" bounds="$4" filename="$5"
            local size sha url entry
            size="$(stat -c '%s' "$source")"
            test "$size" -gt 0
            test "$size" -lt 1900000000
            cp "$source" "work/$filename"
            sha="$(sha256sum "work/$filename" | awk '{print $1}')"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/offline-maps/$filename"
            entry="$(jq -n --arg regionId "$id" --arg region "$label" --arg version "$MAP_VERSION" \
              --arg engineVersion "valhalla-mobile-0.6.4 / Valhalla 3.9.1" --arg packageUrl "$url" \
              --arg sha256 "$sha" --arg sourceUrl "$SOURCE_URL" --argjson sizeBytes "$size" \
              --argjson coverageBounds "$bounds" \
              '{regionId:$regionId,region:$region,version:$version,engineVersion:$engineVersion,packageUrl:$packageUrl,sizeBytes:$sizeBytes,sha256:$sha256,sourceUrl:$sourceUrl,coverageBounds:$coverageBounds}')"
            REGIONS="$(jq -cn --argjson existing "$REGIONS" --argjson entry "$entry" '$existing + [$entry]')"
            echo "Prepared $id: $size bytes; SHA-256 $sha"
          }
          publish_entry "mumbai-pune-nashik-alibag-v1" "Mumbai · Pune · Nashik · Alibag corridor" "work/offline-maps.tar" '{"south":17.0,"north":21.2,"west":71.8,"east":75.2}' "offline-maps-${MAP_VERSION}.tar"
          publish_entry "mumbai-metro" "Mumbai metro" "work/area-mumbai-metro.tar" '{"south":18.6,"north":19.7,"west":72.4,"east":73.5}' "offline-maps-mumbai-metro-${MAP_VERSION}.tar"
          publish_entry "pune" "Pune area" "work/area-pune.tar" '{"south":18.1,"north":19.0,"west":73.3,"east":74.2}' "offline-maps-pune-${MAP_VERSION}.tar"
          publish_entry "nashik" "Nashik area" "work/area-nashik.tar" '{"south":19.4,"north":20.4,"west":73.1,"east":74.2}' "offline-maps-nashik-${MAP_VERSION}.tar"
          publish_entry "alibag" "Alibag area" "work/area-alibag.tar" '{"south":18.2,"north":19.0,"west":72.4,"east":73.3}' "offline-maps-alibag-${MAP_VERSION}.tar"
          jq -n --argjson schemaVersion 1 --argjson regions "$REGIONS" --arg attribution "$ATTRIBUTION" \
            '{schemaVersion:$schemaVersion,regions:$regions,attribution:$attribution}' > work/offline-maps-manifest.json
          printf '%s\n' "$ATTRIBUTION" > work/offline-maps-attribution.txt
          echo "map_version=$MAP_VERSION" >> "$GITHUB_OUTPUT"
          cat work/offline-maps-manifest.json

      - name: Publish versioned area packages and stable catalog
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view offline-maps --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create offline-maps --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "KFE Offline Maps" \
              --notes "Selectable regional Valhalla tile packages for KFE. Catalog: offline-maps-manifest.json. © OpenStreetMap contributors; ODbL applies."
          gh release upload offline-maps --repo "$GITHUB_REPOSITORY" --clobber \
            work/offline-maps-${{ steps.package.outputs.map_version }}.tar \
            work/offline-maps-mumbai-metro-${{ steps.package.outputs.map_version }}.tar \
            work/offline-maps-pune-${{ steps.package.outputs.map_version }}.tar \
            work/offline-maps-nashik-${{ steps.package.outputs.map_version }}.tar \
            work/offline-maps-alibag-${{ steps.package.outputs.map_version }}.tar \
            work/offline-maps-manifest.json work/offline-maps-attribution.txt
          echo "Published the catalog and five checksummed area packages."

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfe-offline-valhalla-map-build-evidence
          path: |
            work/offline-maps-manifest.json
            work/offline-maps-attribution.txt
            work/result-*.json
          if-no-files-found: warn
          retention-days: 14
