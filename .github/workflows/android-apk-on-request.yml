name: KFE Android APK (on request)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: kfe-apk-on-request
  cancel-in-progress: true

jobs:
  build-apk:
    if: >-
      github.event.comment.body == '/build-apk' &&
      github.event.comment.user.login == 'amtalwalkar-sudo'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve build revision
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event.issue.pull_request != null }}" = "true" ]; then
            REF="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid -q .headRefOid)"
          else
            REF="main"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved APK build revision: $REF"

      - name: Checkout requested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Production PWA Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Verify persistent Android signing configuration
        env:
          KFE_ANDROID_KEYSTORE_BASE64: ${{ secrets.KFE_ANDROID_KEYSTORE_BASE64 }}
          KFE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KFE_ANDROID_KEYSTORE_PASSWORD }}
          KFE_ANDROID_KEY_ALIAS: ${{ secrets.KFE_ANDROID_KEY_ALIAS }}
          KFE_ANDROID_KEY_PASSWORD: ${{ secrets.KFE_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KFE_ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing KFE_ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$KFE_ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing KFE_ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KFE_ANDROID_KEY_ALIAS" || { echo "::error::Missing KFE_ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KFE_ANDROID_KEY_PASSWORD" || { echo "::error::Missing KFE_ANDROID_KEY_PASSWORD repository secret"; exit 1; }

      - name: Configure persistent Android signing key
        env:
          KFE_ANDROID_KEYSTORE_BASE64: ${{ secrets.KFE_ANDROID_KEYSTORE_BASE64 }}
          KFE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KFE_ANDROID_KEYSTORE_PASSWORD }}
          KFE_ANDROID_KEY_ALIAS: ${{ secrets.KFE_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          # Normalize copied Base64 defensively. GitHub secrets may contain wrapped
          # lines or copied formatting; keytool below remains the authoritative integrity check.
          B64="$(printf '%s' "$KFE_ANDROID_KEYSTORE_BASE64" |
            tr -cd 'A-Za-z0-9+/=_-' |
            tr '_-' '/+')"
          B64="${B64//=/}"
          case $((${#B64} % 4)) in
            0) ;;
            2) B64="${B64}==" ;;
            3) B64="${B64}=" ;;
            *) echo "::error::Invalid Base64 length"; exit 1 ;;
          esac
          printf '%s' "$B64" |
            base64 --decode > android/keystore/kfe-release.jks
          test -s android/keystore/kfe-release.jks
          keytool -list -keystore android/keystore/kfe-release.jks \
            -storepass "$KFE_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$KFE_ANDROID_KEY_ALIAS" >/dev/null

      - name: Build Android APK with persistent signing identity
        working-directory: android
        env:
          KFE_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/kfe-release.jks
          KFE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KFE_ANDROID_KEYSTORE_PASSWORD }}
          KFE_ANDROID_KEY_ALIAS: ${{ secrets.KFE_ANDROID_KEY_ALIAS }}
          KFE_ANDROID_KEY_PASSWORD: ${{ secrets.KFE_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Verify APK package and signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK" | grep "^package:")"
          APP_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test "$APP_ID" = "com.kanishka.pwa" || { echo "::error::Unexpected APK package ID: $APP_ID"; exit 1; }
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          CERT_REPORT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$CERT_REPORT"
          CERT_SHA256="$(printf '%s\n' "$CERT_REPORT" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}')"
          test -n "$CERT_SHA256" || { echo "::error::Could not extract APK signing certificate fingerprint"; exit 1; }
          CERT_SHA256_NORMALIZED="$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="3099f60a97640f72931b7c33bc8330a845bdc1e4979b9ea3de0429db54a3eb2f"
          test "$CERT_SHA256_NORMALIZED" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::APK signing certificate mismatch. Expected approved KFE certificate SHA-256 $EXPECTED_CERT_SHA256; got $CERT_SHA256_NORMALIZED"
            exit 1
          }
          mkdir -p artifacts/android-signing
          {
            echo "git_commit=$(git rev-parse HEAD)"
            echo "application_id=$APP_ID"
            echo "version_code=$VERSION_CODE"
            echo "version_name=$VERSION_NAME"
            echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
            echo "signer_certificate_sha256=$CERT_SHA256"
          } > artifacts/android-signing/release-identity.txt
          cat artifacts/android-signing/release-identity.txt

      - name: Upload APK signing identity
        uses: actions/upload-artifact@v4
        with:
          name: kfe-android-signing-identity
          path: artifacts/android-signing/release-identity.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload requested APK
        uses: actions/upload-artifact@v4
        with:
          name: kfe-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Report APK request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            BODY="APK build completed successfully. Download the kfe-android-debug-apk artifact from this run: $RUN_URL"
          else
            BODY="APK build failed. See the workflow run for details: $RUN_URL"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "$BODY"
