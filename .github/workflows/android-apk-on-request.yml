name: KFE Android APK (on request)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: kfe-apk-on-request
  cancel-in-progress: true

jobs:
  build-apk:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/build-apk' &&
      github.event.comment.user.login == 'amtalwalkar-sudo'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Production PWA Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload requested APK
        uses: actions/upload-artifact@v4
        with:
          name: kfe-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Report APK request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            BODY="APK build completed successfully. Download the `kfe-android-debug-apk` artifact from this run: $RUN_URL"
          else
            BODY="APK build failed. See the workflow run for details: $RUN_URL"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"
