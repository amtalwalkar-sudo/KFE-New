name: Deploy KFE PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run KFE Contract Tests
        run: npm test

      - name: Build Production PWA
        run: npm run build

      - name: Validate GitHub Pages Artifact
        run: |
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/service-worker.js
          test -f dist/icon-192.png
          test -f dist/icon-512.png
          grep -q '/KFE-New/assets/' dist/index.html
          ! grep -q './src/main.js' dist/index.html
          echo 'GitHub Pages artifact structure and Vite asset paths are valid.'

      - name: Install Chromium for Runtime Smoke Test
        run: npx playwright install --with-deps chromium

      - name: Run GitHub Pages Runtime Smoke Test
        run: node tools/pages-runtime-smoke.mjs

      - name: Preserve SPA Routes for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
