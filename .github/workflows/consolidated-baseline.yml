name: KFE 2.0 single CI

on:
  push:
    branches: [ main, kfe-clean-build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kfe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency risk
        run: npm audit --audit-level=high

      - name: Run KFE Foundation Contract Tests
        run: npm test

      - name: Build Production PWA Assets
        run: npm run build

      - name: Run Phase 10 Hardening / Release Gate
        run: node src/tests/phase10HardeningRelease.contract.js

      - name: Complete PWA Static Assets
        run: |
          cp icon-192.png dist/icon-192.png
          cp icon-512.png dist/icon-512.png

      - name: Validate GitHub Pages Artifact
        run: |
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/service-worker.js
          grep -q "cached application shell" dist/service-worker.js
          test -f dist/icon-192.png
          test -f dist/icon-512.png
          grep -q '\./assets/' dist/index.html
          ! grep -q '/KFE-New/assets/' dist/index.html
          ! grep -q './src/main.js' dist/index.html
          echo 'GitHub Pages artifact structure and relative Vite asset paths are valid.'

      - name: Install Chromium for Runtime Smoke Test
        run: npx playwright install --with-deps chromium

      - name: Run GitHub Pages Runtime Smoke Test
        run: node tools/pages-runtime-smoke.mjs

      - name: Run Phase 4 Synthetic ↔ Canonical Repository Isolation
        run: node tools/phase4-synthetic-canonical-isolation.mjs
      - name: Run Phase 4 Persistence & Recovery
        run: node tools/phase4-persistence-recovery.mjs

      - name: Run Phase 4 Cross-surface Lifecycle
        run: node tools/phase4-cross-surface-lifecycle.mjs
      - name: Run Phase 4 A-J Automated Matrix
        run: node tools/phase4-a-j-automated-matrix.mjs
      - name: Run Phase 4 Operational Gap Suite
        run: node tools/phase4-operational-gap-suite.mjs


      - name: Run Phase 4 Runtime Visual Verification
        run: node tools/phase4-runtime-visual-smoke.mjs

      - name: Upload Phase 4 Runtime Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfe-phase4-runtime-visual-verification
          path: artifacts/phase4-runtime/
          if-no-files-found: warn

      - name: Preserve SPA Routes for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp dist/index.html dist/404.html

      - name: Upload GitHub Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed SPA fallback on every history route
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          for route in / /timeline /performance /admin; do
            url="${base}${route}"
            body="/tmp/kfe-pages-route.html"
            status="$(curl -sS -L -o "$body" -w '%{http_code}' "$url")"
            grep -q "Kanishka Enterprises" "$body"
            echo "Verified GitHub Pages fallback body for ${route} (HTTP ${status})."
          done

  android-release-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Production PWA Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Capture exact APK identity
        run: |
          mkdir -p artifacts/android-golden
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/android-golden/app-debug.apk
          sha256sum artifacts/android-golden/app-debug.apk | tee artifacts/android-golden/apk.sha256

      - name: Android Exact APK Smoke Gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 6000M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -wipe-data
          disable-animations: true
          enable-hw-keyboard: false
          script: |
            set -euo pipefail
            adb wait-for-device
            for i in $(seq 1 180); do
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              package_state="$(adb shell service check package 2>/dev/null || true)"
              if [ "$boot" = "1" ] && echo "$package_state" | grep -q "found"; then
                break
              fi
              sleep 2
            done
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            package_state="$(adb shell service check package 2>/dev/null || true)"
            test "$boot" = "1"
            echo "$package_state" | grep -q "found"
            cd "$GITHUB_WORKSPACE/android"
            ./gradlew :app:assembleDebugAndroidTest
            adb install -r "$GITHUB_WORKSPACE/artifacts/android-golden/app-debug.apk"
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            adb shell appops set com.kanishka.pwa android:system_alert_window allow
            adb shell appops set com.kanishka.pwa android:camera allow || true
            adb shell am force-stop com.kanishka.pwa
            adb shell am instrument -w -r -e class com.kanishka.pwa.KfeOverlaySmokeTest com.kanishka.pwa.test/androidx.test.runner.AndroidJUnitRunner
            sha256sum "$GITHUB_WORKSPACE/artifacts/android-golden/app-debug.apk"

      - name: Upload tested Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kfe-android-debug-apk
          path: artifacts/android-golden/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android Golden Gate identity
        uses: actions/upload-artifact@v4
        with:
          name: kfe-android-golden-gate-identity
          path: artifacts/android-golden/apk.sha256
          if-no-files-found: error
          retention-days: 7
