name: KFE 2.0 single CI

on:
  push:
    branches: [ main, kfe-clean-build ]
  pull_request:
    branches: [ main, fix/native-overlay-background-transitions ]
  workflow_dispatch:
    inputs:
      enable_first_run_setup:
        description: Enable first-run setup for the launch deployment
        required: false
        type: boolean
        default: false
      run_android_release_gate:
        description: Explicitly run native Android APK and emulator verification
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kfe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect change impact
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.classify.outputs.app_changed }}
      android_changed: ${{ steps.classify.outputs.android_changed }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ANDROID_GATE: ${{ inputs.run_android_release_gate }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE_SHA...$HEAD_SHA" > /tmp/kfe-changed-files.txt
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              echo "Initial/unknown push base; conservatively run all gates."
              echo "app_changed=true" >> "$GITHUB_OUTPUT"
              echo "android_changed=true" >> "$GITHUB_OUTPUT"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git diff --name-only "$PUSH_BEFORE_SHA" "$HEAD_SHA" > /tmp/kfe-changed-files.txt
          else
            # Manual dispatch always runs the app suite; native verification is opt-in.
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            if [[ "$RUN_ANDROID_GATE" == "true" ]]; then
              echo "android_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "android_changed=false" >> "$GITHUB_OUTPUT"
            fi
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app_changed=false
          android_changed=false
          docs_only=true
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            if [[ "$file" != docs/* || "$file" != *.md ]]; then
              docs_only=false
              app_changed=true
            fi
            case "$file" in
              android/*|capacitor.config.*|package.json|package-lock.json|vite.config.*|tools/android-*|.github/workflows/*)
                android_changed=true
                ;;
            esac
          done < /tmp/kfe-changed-files.txt
          if [[ ! -s /tmp/kfe-changed-files.txt ]]; then
            app_changed=true
            docs_only=false
          fi
          printf 'Changed paths:\n'
          cat /tmp/kfe-changed-files.txt
          echo "app_changed=$app_changed" >> "$GITHUB_OUTPUT"
          echo "android_changed=$android_changed" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Classification: app=$app_changed android=$android_changed docs_only=$docs_only"

  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency risk
        run: npm audit --audit-level=high --package-lock-only --omit=dev

      - name: Run KFE Foundation Contract Tests
        run: npm test
      - name: Run 11-Step End-to-End Conformance Gate
        run: node src/tests/endToEndConformance.contract.js

      - name: Build Production PWA Assets
        env:
          VITE_ENABLE_FIRST_RUN_SETUP: ${{ inputs.enable_first_run_setup && 'true' || 'false' }}
        run: npm run build

      - name: Run Phase 10 Hardening / Release Gate
        run: node src/tests/phase10HardeningRelease.contract.js

      - name: Complete PWA Static Assets
        run: |
          cp icon-192.png dist/icon-192.png
          cp icon-512.png dist/icon-512.png

      - name: Validate GitHub Pages Artifact
        run: |
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/service-worker.js
          grep -q "cached application shell" dist/service-worker.js
          ! grep -q '__KFE_BUILD_ID__' dist/service-worker.js
          grep -Eq "kfe-pwa-shell-[A-Za-z0-9._-]+" dist/service-worker.js
          test -f dist/icon-192.png
          test -f dist/icon-512.png
          grep -q '\./assets/' dist/index.html
          ! grep -q '/KFE-New/assets/' dist/index.html
          ! grep -q './src/main.js' dist/index.html
          echo 'GitHub Pages artifact structure and relative Vite asset paths are valid.'

      - name: Install Chromium for Runtime Smoke Test
        run: npx playwright install --with-deps chromium

      - name: Run GitHub Pages Runtime Smoke Test
        run: node tools/pages-runtime-smoke.mjs

      - name: Run Phase 4 Persistence & Recovery
        run: node tools/phase4-persistence-recovery.mjs

      - name: Run Phase 4 Cross-surface Lifecycle
        run: node tools/phase4-cross-surface-lifecycle.mjs
      - name: Run Phase 4 A-J Automated Matrix
        run: node tools/phase4-a-j-automated-matrix.mjs
      - name: Run Phase 4 Operational Gap Suite
        run: node tools/phase4-operational-gap-suite.mjs

      - name: Run Phase 4 Runtime Visual Verification
        run: node tools/phase4-runtime-visual-smoke.mjs

      - name: Run Core App UI Smoke
        run: node tools/core-app-ui-smoke.mjs

      - name: Run Semantic Control Audit
        run: node tools/semantic-control-audit.mjs

      - name: Upload Phase 4 Runtime Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfe-phase4-runtime-visual-verification
          path: artifacts/phase4-runtime/
          if-no-files-found: warn

      - name: Preserve SPA Routes for GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          cp dist/index.html dist/404.html
          for route in timeline performance admin; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
            sed -i 's#\./assets/#../assets/#g; s#\./manifest\.json#../manifest.json#g' "dist/$route/index.html"
          done
          grep -q '../assets/' dist/timeline/index.html
          grep -q '../manifest.json' dist/timeline/index.html

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [detect-changes, build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout Repository for deployed runtime verification
        uses: actions/checkout@v5

      - name: Setup Node.js for deployed runtime verification
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deployed runtime verification dependencies
        run: npm ci

      - name: Install Chromium for deployed runtime verification
        run: npx playwright install --with-deps chromium

      - name: Verify deployed SPA fallback and visible runtime on every route
        env:
          KFE_RUNTIME_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tools/deployed-pages-runtime-smoke.mjs

      - name: Upload deployed runtime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfe-deployed-runtime-visual-verification
          path: artifacts/phase4-runtime/
          if-no-files-found: warn

  android-release-gate:
    # Run emulator verification only when native packaging/dependencies/workflow infrastructure may be affected.
    needs: detect-changes
    if: needs.detect-changes.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    # Bound emulator setup, instrumentation, and artifact collection so a wedged ADB session cannot consume the runner's six-hour default.
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Production PWA Assets
        env:
          VITE_ENABLE_FIRST_RUN_SETUP: ${{ inputs.enable_first_run_setup && 'true' || 'false' }}
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Verify persistent Android signing configuration
        env:
          KFE_ANDROID_KEYSTORE_BASE64: ${{ secrets.KFE_ANDROID_KEYSTORE_BASE64 }}
          KFE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KFE_ANDROID_KEYSTORE_PASSWORD }}
          KFE_ANDROID_KEY_ALIAS: ${{ secrets.KFE_ANDROID_KEY_ALIAS }}
          KFE_ANDROID_KEY_PASSWORD: ${{ secrets.KFE_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KFE_ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing KFE_ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$KFE_ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing KFE_ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KFE_ANDROID_KEY_ALIAS" || { echo "::error::Missing KFE_ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KFE_ANDROID_KEY_PASSWORD" || { echo "::error::Missing KFE_ANDROID_KEY_PASSWORD repository secret"; exit 1; }

      - name: Configure persistent Android signing key
        env:
          KFE_ANDROID_KEYSTORE_BASE64: ${{ secrets.KFE_ANDROID_KEYSTORE_BASE64 }}
          KFE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KFE_ANDROID_KEYSTORE_PASSWORD }}
          KFE_ANDROID_KEY_ALIAS: ${{ secrets.KFE_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          B64="$(printf '%s' "$KFE_ANDROID_KEYSTORE_BASE64" |
            tr -cd 'A-Za-z0-9+/=_-' |
            tr '_-' '/+')"
          B64="${B64//=/}"
          case $((${#B64} % 4)) in
            0) ;;
            2) B64="${B64}==";;
            3) B64="${B64}=";;
            *) echo "::error::Invalid Base64 length"; exit 1;;
          esac
          printf '%s' "$B64" | base64 --decode > android/keystore/kfe-release.jks
          test -s android/keystore/kfe-release.jks
          keytool -list -keystore android/keystore/kfe-release.jks \
            -storepass "$KFE_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$KFE_ANDROID_KEY_ALIAS" >/dev/null

      - name: Build Android Debug APK with persistent signing identity
        working-directory: android
        env:
          KFE_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/kfe-release.jks
          KFE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KFE_ANDROID_KEYSTORE_PASSWORD }}
          KFE_ANDROID_KEY_ALIAS: ${{ secrets.KFE_ANDROID_KEY_ALIAS }}
          KFE_ANDROID_KEY_PASSWORD: ${{ secrets.KFE_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Capture exact APK and release identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-golden
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" artifacts/android-golden/app-debug.apk
          APK="artifacts/android-golden/app-debug.apk"
          sha256sum "$APK" | tee artifacts/android-golden/apk.sha256
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK" | grep "^package:")"
          APP_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          test "$APP_ID" = "com.kanishka.pwa" || { echo "::error::Unexpected APK package ID: $APP_ID"; exit 1; }
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          CERT_REPORT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$CERT_REPORT"
          CERT_SHA256="$(printf '%s\n' "$CERT_REPORT" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}')"
          test -n "$CERT_SHA256" || { echo "::error::Could not extract APK signing certificate fingerprint"; exit 1; }
          CERT_SHA256_NORMALIZED="$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="3099f60a97640f72931b7c33bc8330a845bdc1e4979b9ea3de0429db54a3eb2f"
          test "$CERT_SHA256_NORMALIZED" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::APK signing certificate mismatch. Expected approved KFE certificate SHA-256 $EXPECTED_CERT_SHA256; got $CERT_SHA256_NORMALIZED"
            exit 1
          }
          {
            echo "git_commit=$(git rev-parse HEAD)"
            echo "application_id=$APP_ID"
            echo "version_code=$VERSION_CODE"
            echo "version_name=$VERSION_NAME"
            echo "apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"
            echo "signer_certificate_sha256=$CERT_SHA256"
          } > artifacts/android-golden/release-identity.txt
          cat artifacts/android-golden/release-identity.txt

      - name: Enable KVM access for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device is not available on this runner; emulator will use software acceleration."
          fi

      - name: Android Exact APK Smoke Gate
        timeout-minutes: 105
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KFE_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/kfe-release.jks
          KFE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KFE_ANDROID_KEYSTORE_PASSWORD }}
          KFE_ANDROID_KEY_ALIAS: ${{ secrets.KFE_ANDROID_KEY_ALIAS }}
          KFE_ANDROID_KEY_PASSWORD: ${{ secrets.KFE_ANDROID_KEY_PASSWORD }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-spellchecker: true
          disk-size: 4000M
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          enable-hw-keyboard: false
          script: |
            # The exact smoke-gate script supplies GPS fixes only around the offline
            # one-shot boundary test. Avoid a workflow-wide background ADB feeder:
            # it can outlive the script and keep the emulator action alive after all
            # instrumentation has passed.
            bash "$GITHUB_WORKSPACE/tools/android-exact-apk-smoke-gate.sh"

      - name: Upload Android instrumentation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kfe-android-instrumentation-logs
          path: artifacts/android-golden/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload tested Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kfe-android-debug-apk
          path: artifacts/android-golden/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android Golden Gate identity
        uses: actions/upload-artifact@v4
        with:
          name: kfe-android-golden-gate-identity
          path: artifacts/android-golden/apk.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android release identity
        uses: actions/upload-artifact@v4
        with:
          name: kfe-android-release-identity
          path: artifacts/android-golden/release-identity.txt
          if-no-files-found: error
          retention-days: 7
