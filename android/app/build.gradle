apply plugin: 'com.android.application'

android {
    namespace = "com.kanishka.pwa"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kanishka.pwa"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "2.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def signingStore = System.getenv("KFE_ANDROID_KEYSTORE_PATH")
            def signingStorePassword = System.getenv("KFE_ANDROID_KEYSTORE_PASSWORD")
            def signingAlias = System.getenv("KFE_ANDROID_KEY_ALIAS")
            def signingKeyPassword = System.getenv("KFE_ANDROID_KEY_PASSWORD")
            if (signingStore && signingStorePassword && signingAlias && signingKeyPassword) {
                storeFile file(signingStore)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }

    // Preserve the original application ID so Android upgrades the installed app in place.
    // The signing certificate must also match the installed release key to avoid signature conflicts.
    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
            if (System.getenv("KFE_ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (System.getenv("KFE_ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            assets.srcDir(rootProject.file("../spec/work-domain"))
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.stadiamaps:osrm-openapi:0.0.10"
    implementation "com.squareup.moshi:moshi:1.15.1"
    implementation "com.squareup.moshi:moshi-kotlin:1.15.1"
    implementation project(':capacitor-android')
    implementation project(':capawesome-team-capacitor-android-foreground-service')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
